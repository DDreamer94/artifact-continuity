<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">Artifact Continuity: keep edits and manage redundant drafts</title><desc id="desc">A synthetic Atlas example: preserve human edits and required history while reconciling redundant drafts.</desc><rect width="1280" height="640" fill="#F7F5EF"/><g fill="none" stroke="#24694F" stroke-width="2.5"><path d="M58 34h17l9 9v23H58z"/><path d="M75 34v10h9M65 51h12M65 58h12"/></g><text x="100" y="59" fill="#182624" font-size="24" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif">ARTIFACT CONTINUITY</text><text x="56" y="134" fill="#182624" font-size="52" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif">Keep the edits.</text><text x="56" y="195" fill="#182624" font-size="52" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif">Lose the redundant drafts.</text><text x="56" y="242" fill="#59665E" font-size="24" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif">An agent skill for revisions that keep your project manageable.</text><rect x="56" y="281" width="525" height="252" rx="12" fill="white" stroke="#D8DED5"/><rect x="699" y="281" width="525" height="252" rx="12" fill="#E4ECE4" stroke="#D8DED5"/><text x="82" y="319" fill="#59665E" font-size="17" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif">DRAFTS ACCUMULATE</text><text x="82" y="362" fill="#182624" font-size="24" font-weight="400" font-family="Menlo, monospace">brief.md</text><text x="82" y="403" fill="#182624" font-size="24" font-weight="400" font-family="Menlo, monospace">draft-v2.md</text><text x="82" y="444" fill="#182624" font-size="24" font-weight="400" font-family="Menlo, monospace">brief-final.md</text><text x="82" y="485" fill="#182624" font-size="24" font-weight="400" font-family="Menlo, monospace">release-baseline.md</text><path d="M609 407h62m-15-13 15 13-15 13" fill="none" stroke="#24694F" stroke-width="3"/><text x="725" y="319" fill="#24694F" font-size="17" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif">ONE CURRENT HOME</text><text x="725" y="362" fill="#182624" font-size="24" font-weight="400" font-family="Menlo, monospace">brief.md</text><text x="725" y="403" fill="#182624" font-size="24" font-weight="400" font-family="Menlo, monospace">release-baseline.md</text><text x="725" y="465" fill="#24694F" font-size="22" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif">Useful notes merged.</text><text x="725" y="499" fill="#24694F" font-size="22" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif">Required history kept.</text><text x="56" y="578" fill="#59665E" font-size="21" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif">Reconcile first. Retire only checked redundant copies.</text><text x="56" y="612" fill="#182624" font-size="21" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif">github.com/DDreamer94/artifact-continuity</text></svg>